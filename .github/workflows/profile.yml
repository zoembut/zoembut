name: Perbarui profil

# Kartu statistik dan ular kontribusi diperbarui otomatis setiap 6 jam.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buat kartu statistik
        run: |
          pip install --quiet fonttools
          python .github/scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Buat ular kontribusi
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?palette=github-light&color_snake=#FF2E88&color_dots=#EFEAF5,#FFF3A3,#FFE500,#FF8AC2,#FF2E88
            assets/snake-dark.svg?palette=github-dark&color_snake=#FFE500&color_dots=#1F1B2E,#3C2A55,#8B5CF6,#FF2E88,#FFE500

      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/snake-*.svg
          git diff --cached --quiet || git commit -m "Perbarui statistik profil."
          git push
