name: Perbarui profil

# Kartu statistik dan ular kontribusi diperbarui otomatis setiap 6 jam.
# Selama Actions akun terkunci (tagihan), jalankan Perbarui-Profil.cmd dari komputer sendiri.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buat kartu statistik
        run: |
          pip install --quiet fonttools
          python .github/scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Buat ular kontribusi
        run: node .github/scripts/snake.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Simpan hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/snake-*.svg
          git diff --cached --quiet || git commit -m "Perbarui statistik profil."
          git push
